<!-- Мініпрограма бота Forsaken Atlas (16.11.2026). Статична сторінка без сервера.
     Дані: 1) знімок у самій адресі (параметр ?d=; його кладе бот на ПК автора, коли оновлює кнопку);
           2) кнопка «Оновити» і відкриття сторінки читають свіжий знімок із прихованого gist автора (параметр ?g=<id>; бот оновлює його приблизно раз на хвилину).
     Сама сторінка нічого нікуди не надсилає; «Показати в чаті» лише відкриває чат із ботом із позначкою відео. -->
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{--bg:#0d0d0e;--card:#161618;--line:#26262a;--txt:#f4f1ea;--dim:#8f8f98;--gold:#d6a63e;--acc:#a04e30;--acc2:#c9694a;--ok:#7ec48a}

.bar{height:8px;border-radius:6px;background:#27272c;overflow:hidden}

.v{display:flex;align-items:center;gap:10px;padding:9px 0;border-top:1px solid var(--line)} .v:first-of-type{border-top:0} .v .t{flex:1;font-weight:600}

.c{display:flex;gap:11px;align-items:flex-start;padding:9px 0;border-top:1px solid var(--line)} .c:first-of-type{border-top:0} .c input{width:21px;height:21px;accent-color:var(--acc);flex:none;margin:0} .c input:checked+span{color:var(--dim);text-decoration:line-through}

.pl svg{display:block}
.pl .side{position:relative;transition:transform .15s} .pl .side:active{transform:scale(.88)} .pl .bigp{transition:transform .15s,background .15s} .pl .bigp:active{transform:scale(.9)}
.pl .side.go svg{animation:rotL .5s cubic-bezier(.3,.7,.2,1)} .pl .fw.go svg{animation-name:rotR}
.pl .side.go:after{content:"";position:absolute;left:0;top:0;right:0;bottom:0;border-radius:50%;border:2px solid var(--gold);animation:ring .5s ease-out forwards;pointer-events:none}
.pl .fs.go svg{animation:pop .42s cubic-bezier(.3,.7,.2,1)}

.pl .fs{font-size:28px}
.pl .tm{font-size:13px;color:#f1eee7;font-variant-numeric:tabular-nums;min-width:36px;text-align:center}

.pl .pvw span{position:absolute;left:50%;bottom:5px;transform:translateX(-50%);background:rgba(0,0,0,.74);color:#fff;font:700 12.5px/1 inherit;padding:4px 7px;border-radius:6px;font-variant-numeric:tabular-nums}
.pl.nopv .pvw{width:auto;border:0;background:transparent;box-shadow:none} .pl.nopv .pvw i{display:none} .pl.nopv .pvw span{position:static;transform:none;display:inline-block;background:var(--gold);color:#111}

.pl.wait:after{content:"";position:absolute;left:50%;top:50%;width:40px;height:40px;margin:-46px 0 0 -20px;border:3px solid rgba(255,255,255,.22);border-top-color:var(--gold);border-radius:50%;animation:spin .8s linear infinite;pointer-events:none}
.pl:fullscreen{margin:0;border-radius:0;display:flex;align-items:center;justify-content:center} .pl:fullscreen .mv{width:100%;height:100%;max-height:none;aspect-ratio:auto}

.ft{color:var(--dim);font-size:12px;text-align:center;margin-top:14px} #fv{margin-top:4px;opacity:.7}
.toast{position:fixed;left:12px;right:12px;top:10px;z-index:20;background:var(--gold);color:#111;border-radius:14px;padding:12px 14px;font-weight:700;font-size:13.5px;box-shadow:0 8px 30px rgba(0,0,0,.55);transform:translateY(-160%);transition:transform .35s cubic-bezier(.2,.8,.2,1)}
.toast.on{transform:none} .toast small{display:block;font-weight:500;margin-top:3px;opacity:.86}
